<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo link khách mời</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f4;font-family:Arial,sans-serif;color:#19272a}
main{max-width:560px;margin:auto;padding:28px 16px}.box{background:#fff;padding:22px;border-radius:18px;box-shadow:0 12px 35px rgba(40,65,70,.12)}
h1{font:28px Georgia,serif;margin:0 0 8px}p{color:#607176;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;height:48px;border:1px solid #b7c6c9;border-radius:12px;padding:0 14px;font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{height:48px;margin-top:12px;border:0;border-radius:12px;background:#718f97;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.actions button+button{background:#263d42}
#result{margin-top:17px;padding:14px;border:1px dashed #9eafb3;border-radius:12px;background:#f9fbfb;word-break:break-all;line-height:1.5}
</style>
</head>
<body>
<main><div class="box">
<h1>Tạo link thiệp theo tên khách</h1>
<p>Tên khách sẽ xuất hiện ở phần <b>Trân trọng kính mời</b> trên bìa boarding pass.</p>
<label for="guest">Tên khách mời</label>
<input id="guest" placeholder="Ví dụ: Khánh Linh">
<label for="base">Địa chỉ website</label>
<input id="base">
<div class="actions"><button id="make">Tạo link</button><button id="copy">Sao chép</button></div>
<div id="result">Chưa tạo link.</div>
</div></main>
<script>
const g=document.getElementById("guest"),b=document.getElementById("base"),r=document.getElementById("result");
b.value=location.href.replace(/tao-link-khach\.html.*$/,"");
function make(){const n=g.value.trim();if(!n){r.textContent="Hãy nhập tên khách.";return""}let root=b.value.trim();if(!root.endsWith("/"))root+="/";const url=root+"?guest="+encodeURIComponent(n);r.textContent=url;return url}
document.getElementById("make").onclick=make;
document.getElementById("copy").onclick=async()=>{const u=make();if(!u)return;try{await navigator.clipboard.writeText(u);document.getElementById("copy").textContent="Đã sao chép";setTimeout(()=>document.getElementById("copy").textContent="Sao chép",1200)}catch(e){prompt("Sao chép link:",u)}};
g.addEventListener("keydown",e=>{if(e.key==="Enter")make()});
</script>
</body></html>
