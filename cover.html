    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }

        /* Container mô phỏng kích thước Mobile của LadiPage */
        .mobile-container {
            position: relative;
            width: 420px;
            max-width: 100vw;
            min-height: 862px;
            background-image: url("https://w.ladicdn.com/s750x1200/691804d3a89f3900120ca482/bg5-20260723093909-sw6oc.jpg");
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* Lớp phủ mờ background */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
        }

        /* Cụm Tên Cô Dâu Chú Rể */
        .couple-names {
            position: absolute;
            top: 40px;
            left: 66px;
            width: 254px;
            text-align: center;
        }

        .couple-names h3 {
            font-size: 40px;
            text-transform: uppercase;
            color: #010101;
            line-height: 1.6;
        }

        .couple-names .ampersand {
            width: 147px;
            margin: -20px auto;
        }

        /* Khung Boarding Pass */
        .boarding-pass-card {
            position: absolute;
            top: 161px;
            left: 87px;
            width: 223px;
            height: 498px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 5px 5px 20px -15px rgba(0, 28, 24, 1);
            padding: 20px 10px;
            text-align: center;
        }

        .boarding-pass-card .invite-text {
            font-size: 14px;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: bold;
        }

        .boarding-pass-card .guest-name {
            font-size: 26px;
            font-style: italic;
            margin-top: 10px;
            color: #000;
        }

        .boarding-pass-card .plane-icon {
            width: 98px;
            margin-top: 320px;
        }

        /* Nút nhấn mở thiệp */
        .open-card-btn {
            position: absolute;
            top: 690px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            text-transform: uppercase;
            text-decoration: underline;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            animation: pulse 1.5s infinite;
        }

        /* Nhóm cover Passport */
        .passport-cover {
            position: absolute;
            top: 280px;
            left: 71px;
            width: 275px;
            height: 327px;
            background-image: url("https://w.ladicdn.com/s600x650/691804d3a89f3900120ca482/2-20260723094152-hrck4.png");
            background-size: cover;
            text-align: center;
            color: #fff;
            padding-top: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .passport-cover:hover {
            transform: scale(1.02);
        }

        .passport-cover h1 {
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .passport-cover p.sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .passport-cover .hh-logo {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 80px;
        }

        .passport-cover .date {
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 100px;
        }

        /* Tem trang trí */
        .stamp-paris {
            position: absolute;
            top: 20px;
            right: -20px;
            width: 86px;
            transform: rotate(-24deg);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 1s ease forwards;
        }
    </style>

<style id="cover-fix-patch">
    html, body { min-height: 100%; }
    body { overflow-x: hidden; }

    .boarding-pass-card{
        padding-right: 42px !important;

    }

        );
    }
    .ticket-barcode::after{
        content:"8 712345 670016";
        position:absolute;
        bottom:5px;
        left:0;
        right:0;
        text-align:center;
        font:11px/1 Arial,sans-serif;
        letter-spacing:1px;
    }

    #coverPassportClick{

        inset:0;

    }
    #coverPassportClick .passport-cover{
        pointer-events:auto;
    }

    .open-card-btn{
        border:0 !important;
        background:transparent !important;
        font-family:inherit !important;
        white-space:nowrap;
    }

    /* Add pin like the screenshot */
    .open-card-btn::before{
        content:"";
        display:inline-block;
        width:15px;

        margin-right:12px;
        vertical-align:-2px;
        border-radius:50% 50% 50% 0;

    /* The source was designed at 420px. Keep its geometry but scale uniformly

            display:block !important;
            width:100vw;
            overflow:hidden;
        }
        .mobile-container{
            width:420px !important;
            max-width:none !important;
            left:50%;
            margin-left:-210px;
            transform:scale(calc(100vw / 420));
            transform-origin:top center;
            box-shadow:none !important;
        }
    }
</style>

}

    line-height:1.02 !important;
    letter-spacing:.15px !important;
    white-space:nowrap !important;
}
.couple-names .ampersand{
    display:block !important;
    width:132px !important;
    height:auto !important;
    margin:-2px auto -3px !important;
}

/* Guest name gets the intended handwritten look instead of browser italic fallback. */
.boarding-pass-card .guest-name{
    font-family:"WeddingScript","Brush Script MT",cursive !important;
    font-style:normal !important;
    font-size:31px !important;
    line-height:1.05 !important;
}

/* ---- opening transition ---- */
.mobile-container,
.couple-names,
.boarding-pass-card,
.passport-cover,
.open-card-btn{
    will-change:transform,opacity,filter;
}

body.cover-leaving .couple-names{
    transform:translateY(-26px) scale(.98);
    opacity:0;
    transition:transform .48s ease,opacity .42s ease;
}
body.cover-leaving .boarding-pass-card{
    transform:translateY(22px) scale(.985);
    opacity:0;
    filter:blur(1.5px);
    transition:transform .52s cubic-bezier(.2,.75,.25,1),opacity .42s ease,filter .42s ease;
}
body.cover-leaving .passport-cover{
    transform:translateY(-22px) scale(1.09) !important;
    opacity:0;
    filter:blur(1px);
    transition:transform .56s cubic-bezier(.16,.82,.22,1),opacity .46s ease,filter .46s ease;
}
body.cover-leaving .open-card-btn{
    transform:translateX(-50%) translateY(24px) scale(.95) !important;
    opacity:0;
    transition:transform .38s ease,opacity .3s ease;
    animation:none !important;
}
body.cover-leaving .mobile-container{
    background-position:center -14px !important;
    transition:background-position .58s ease;
}

/* Soft flash/crossfade layer before the main invitation appears. */
.mobile-container::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:999;
    pointer-events:none;
    background:rgba(245,250,250,.94);
    opacity:0;
    transition:opacity .55s ease .08s;
}
body.cover-leaving .mobile-container::after{
    opacity:1;
}

@media(max-width:419px){
    /* The previous uniform scale is kept; only typography is fixed. */
    .couple-names{
        left:38px !important;
        width:344px !important;
    }
}
@media(prefers-reduced-motion:reduce){
    body.cover-leaving .couple-names,
    body.cover-leaving .boarding-pass-card,
    body.cover-leaving .passport-cover,
    body.cover-leaving .open-card-btn{
        transition:none !important;
    }
    .mobile-container::after{transition:none !important}
}
</style>

   - kết thúc chính xác tại pin của "NHẤN ĐỂ MỞ THIỆP"
   ========================================================= */

/* Disable the old V6 route elements if legacy markup/CSS remains cached */
.cover-flight-route,
.cover-route-plane{
    display:none !important;
}

.flight-route-v7{
    position:absolute;
    inset:0;
    width:420px;
    height:862px;
    z-index:4;
    pointer-events:none;
    overflow:visible;
}

.flight-route-line{
    fill:none;
    stroke:#111;
    stroke-width:1.65;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:5.8 5.8;
    opacity:.92;

    /* subtle moving dash gives a flight feeling without being distracting */
    animation:routeDashMove 10s linear infinite;
}

/* Heart knot sits on the upper-right route.
   It is part of the actual SVG path, not a separate icon. */

.flight-destination-halo{
    fill:none;
    stroke:#111;
    stroke-width:1.2;
    opacity:.28;
}
.flight-destination-dot{
    fill:#111;
}

/* Improved airplane */
.flight-plane-v7{
    position:absolute;
    top:49px;
    left:319px;
    width:54px;
    height:54px;
    z-index:8;
    pointer-events:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.16));
    transform-origin:center;
    animation:planeFloatV7 3.2s ease-in-out infinite;
}
.flight-plane-v7 svg{
    width:100%;
    height:100%;
    display:block;
}

/* Route must stay behind the paper/passport layers */
.boarding-pass-card{z-index:11 !important;}
.passport-cover{z-index:15 !important;}
.couple-names{z-index:18 !important;}
.open-card-btn{z-index:30 !important;}

/* The original pseudo-pin is now treated as the destination marker.
   Move it so its visual center sits on SVG endpoint x=139, y=703. */
.open-card-btn{
    top:690px !important;
}
.open-card-btn::before{
    position:relative;
    z-index:31;
    box-shadow:0 0 0 3px rgba(238,245,246,.72);
}

/* make the route appear to terminate into the destination pin */
@keyframes routeDashMove{
    from{stroke-dashoffset:0}
    to{stroke-dashoffset:-58}
}
@keyframes planeFloatV7{
    0%,100%{transform:translate3d(0,0,0) rotate(-1deg)}
    50%{transform:translate3d(2px,-3px,0) rotate(2deg)}
}

@media(prefers-reduced-motion:reduce){
    .flight-route-line,
    .flight-plane-v7{
        animation:none !important;
    }
}
</style>


<style id="flight-plane-image-v8">
/* V8 — dùng trực tiếp silhouette máy bay người dùng cung cấp */
.flight-plane-v7{
    top:47px !important;
    left:318px !important;
    width:58px !important;
    height:58px !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    transform-origin:center center !important;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.14));
}

.flight-plane-v7 img{
    display:block !important;
    width:100% !important;
    height:100% !important;
    object-fit:contain !important;
    object-position:center !important;
    transform:rotate(18deg) !important;
    transform-origin:center center !important;
    user-select:none !important;
    -webkit-user-drag:none !important;
}

/* Animation now applies to the holder; image keeps the requested flight angle */
@keyframes planeFloatV8{
    0%,100%{transform:translate3d(0,0,0)}
    50%{transform:translate3d(2px,-3px,0)}
}
.flight-plane-v7{
    animation:planeFloatV8 3.2s ease-in-out infinite !important;
}

@media(prefers-reduced-motion:reduce){
    .flight-plane-v7{animation:none !important}
}
</style>

</head>

<script id="cover-runtime">
(function(){
    "use strict";

    const C = window.WEDDING_CONFIG || {};
    const cp = C.couple || {};
    const ev = C.event || {};
    const cv = C.cover || {};
    const guestCfg = C.guest || {};

    const $ = id => document.getElementById(id);

    function guestName(){
        const keys = Array.isArray(guestCfg.queryKeys) && guestCfg.queryKeys.length
            ? guestCfg.queryKeys : ["guest","khach","to"];
        const params = new URLSearchParams(location.search);
        for(const key of keys){
            const value = params.get(key);
            if(value && value.trim()) return value.trim();
        }
        return (guestCfg.defaultName || "Quý khách").trim();
    }

    function dottedDate(s){
        if(!s) return "";
        const a = String(s).split("-");
        return a.length === 3 ? `${a[2]}.${a[1]}.${a[0]}` : s;
    }

    if($("coverBride")) $("coverBride").textContent = (cp.bride || "Cô dâu").toLocaleUpperCase("vi-VN");
    if($("coverGroom")) $("coverGroom").textContent = (cp.groom || "Chú rể").toLocaleUpperCase("vi-VN");
    if($("coverGuest")) {
        $("coverGuest").textContent = guestName();

        // Tự co chữ để tên khách luôn nằm trên một dòng.
        // Ví dụ "Quý khách" giữ khoảng 25px; tên dài sẽ giảm dần tối đa tới 16px.
        const guestEl = $("coverGuest");
        let size = 25;
        guestEl.style.fontSize = size + "px";

        requestAnimationFrame(function fitGuestName(){
            const maxWidth = 166;
            while(guestEl.scrollWidth > maxWidth && size > 16){
                size -= 1;
                guestEl.style.fontSize = size + "px";
            }
        });
    }
    if($("coverMonogram")) $("coverMonogram").textContent = cv.monogram || "TN";
    if($("coverDate")) $("coverDate").textContent = dottedDate(ev.date);

    if($("coverAnd") && $("coverAnd").tagName === "IMG" && cv.andImage) $("coverAnd").src = cv.andImage;
    if($("coverPlane") && cv.planeImage) $("coverPlane").src = cv.planeImage;
    if($("coverStamp") && cv.stampImage) $("coverStamp").src = cv.stampImage;

    const passport = document.querySelector(".passport-cover");
    if(passport && cv.passportImage){
        passport.style.backgroundImage = `url("${cv.passportImage}")`;
    }
    const stage = document.querySelector(".mobile-container");
    if(stage && cv.background){
        stage.style.backgroundImage = `url("${cv.background}")`;
    }

    function openInvitation(){
        if(document.body.classList.contains("cover-leaving")) return;
        document.body.classList.add("cover-leaving");

        // Let the cover animate first, then reveal the main invitation.
        window.setTimeout(function(){
            if(window.parent && window.parent !== window){
                window.parent.postMessage({type:"OPEN_WEDDING_INVITATION"}, "*");
            }else{
                const params = new URLSearchParams(location.search);
                params.set("open", "1");
                location.href = "index.html?" + params.toString();
            }
        }, 470);
    }

    const btn = $("openCoverBtn");
    if(btn) btn.addEventListener("click", openInvitation);

    if(passport){
        passport.addEventListener("click", openInvitation);
        passport.addEventListener("keydown", function(e){
            if(e.key === "Enter" || e.key === " "){
                e.preventDefault();
                openInvitation();
            }
        });
    }
})();
</script>
